<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Für dich ❤️</title>

<style>
body {
  margin:0;
  font-family:"Segoe UI", Arial;
  background: linear-gradient(135deg, #4169E1, #27408B);
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

/* CARD */
.card {
  margin-top:20px;
  width:90%;
  max-width:700px;
  background:rgba(255,255,255,0.85);
  border-radius:20px;
  padding:30px;
  text-align:center;
}

img.hero{
  max-width:150px;
  border-radius:15px;
}

/* BUTTON */
.surprise-btn {
  margin-top:20px;
  padding:12px 20px;
  font-size:1.2rem;
  border:none;
  border-radius:12px;
  background:#d6336c;
  color:white;
  cursor:pointer;
}

/* MESSAGE */
.message {
  margin-top:20px;
  font-size:1.2rem;
  color:#d6336c;
  min-height:60px;
}

/* AUDIO */
audio {
  width:100%;
  margin-top:10px;
}

/* FLOATING ANIMALS */
.floating {
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.item {
  position:absolute;
  animation:rise 6s linear infinite;
  opacity:0.9;
}

@keyframes rise {
  0% {transform:translateY(50px) scale(0.8); opacity:0;}
  10% {opacity:1;}
  50% {transform:translateY(-200px) scale(1.2);}
  100% {transform:translateY(-500px) scale(0.9); opacity:0;}
}

/* FLOATING TEXT */
#floatingMsg {
  position: fixed;
  top: 100px;
  left: 100px;
  font-size: 1.5rem;
  font-weight: bold;
  color: white;
  pointer-events: none;
  z-index: 999;
  text-shadow: 0 0 10px rgba(0,0,0,0.4);
}

/* TIMER */
.timer-box {
  margin-top:20px;
  padding:18px;
  background:rgba(255,255,255,0.65);
  border-radius:15px;
  font-size:1.1rem;
  color:#27408B;
  font-weight:bold;
}

.timer-sub {
  margin-top:5px;
  color:#d6336c;
  font-size:1rem;
}

#timer {
  margin-top:10px;
  font-size:1.5rem;
  color:#4169E1;
}

/* CHECKLIST (schön) */
.checklist {
  margin:20px 0 40px 0;
  background:rgba(255,255,255,0.75);
  padding:25px;
  border-radius:18px;
  width:90%;
  max-width:500px;
  text-align:left;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.checklist h2 {
  color:#d6336c;
  text-align:center;
  margin-bottom:15px;
}

.itembox {
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 0;
  font-size:1.1rem;
  cursor:pointer;
  padding:8px;
  border-radius:10px;
  transition:0.2s;
}

.itembox:hover {
  background:rgba(214,51,108,0.1);
  transform:scale(1.02);
}

.itembox input {
  transform:scale(1.3);
}

/* GALLERY */
.gallery {
  display:flex;
  flex-direction:column;
  gap:20px;
  margin:40px 0;
  align-items:center;
}

.gallery img {
  max-width:90%;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<!-- FLOATING TEXT -->
<div id="floatingMsg">Ich liebe dich ❤️</div>

<div class="floating"></div>

<div class="card">

  <img src="bild.png" class="hero">

  <button class="surprise-btn" id="btn">Klick mal hier 👀</button>

  <div class="message" id="msg"></div>

  <!-- TIMER -->
  <div class="timer-box">
    <div>⏳ Wann ich wieder am einzig richtigen Ort der Welt bin: bei Dir</div>
    <div id="timer">--:--:--:--</div>
  </div>

  <audio controls><source src="song1.mp3"></audio>
  <audio controls><source src="song2.mp3"></audio>
  <audio controls><source src="song3.mp3"></audio>
  <audio controls><source src="song4.mp3"></audio>
  <audio controls><source src="song5.mp3"></audio>

</div>

<!-- CHECKLISTE (über Bilder!) -->
<div class="checklist">
  <h2>todo in Spanien 🌴🐢🦏</h2>

  <label class="itembox"><input type="checkbox"> viel rumknutschen</label>
  <label class="itembox"><input type="checkbox"> Trauben auf dem Markt</label>
  <label class="itembox"><input type="checkbox"> beeindruckende Burg in Almería erkunden</label>
  <label class="itembox"><input type="checkbox"> schwimmen und Nichtstun und Strandball am Strand</label>
  <label class="itembox"><input type="checkbox"> einen Vorgeschmack auf unseren Alltag zusammen bekommen</label>

</div>

<!-- GALERIE -->
<div class="gallery">
  <img src="bild1.png">
  <img src="bild2.png">
  <img src="bild3.png">
  <img src="bild4.png">
  <img src="bild5.png">
</div>

<script>

/* CLICK SYSTEM (DEIN ORIGINAL) */
let step = 0;

const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

btn.addEventListener('click', () => {
  step++;

  if(step === 1){
    msg.textContent = "";
    btn.textContent = "Klick nochmal. Es folgen ein paar Fragen, die ich Chat so gefragt habe :)";
  }
  else if(step === 2){
    msg.textContent = "Kann man bedenkenlos auf dem Preikestolen sitzen sodass die Beine runter baumeln? (klick aufs Nashorn fürs nächste)";
    btn.textContent = "🦏";
  }
  else if(step === 3){
    msg.textContent = "Namenskombination wie in Großbritannien, wie kann man Rappold und Große kombinieren?";
    btn.textContent = "🦏";
  }
  else if(step === 4){
    msg.textContent = "Playlist fürs zweite Date mit Deutsch Indie und bisschen Rock Klassiker/80er";
    btn.style.display = "none";
  }
});

/* FLOATING 🐢🦏 */
const container = document.querySelector('.floating');

function createItem(){
  const el = document.createElement('div');
  el.className = 'item';

  el.style.left = Math.random()*100 + 'vw';
  el.style.fontSize = (30 + Math.random()*30) + 'px';

  el.textContent = Math.random() > 0.5 ? '🐢' : '🦏';

  container.appendChild(el);
  setTimeout(()=>el.remove(),6000);
}

setInterval(createItem,200);

/* BOUNCING TEXT */
const msgEl = document.getElementById("floatingMsg");

let x = 100;
let y = 100;
let dx = 5;
let dy = 5;

function animate() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  const rect = msgEl.getBoundingClientRect();

  x += dx;
  y += dy;

  if (x + rect.width >= w || x <= 0) dx *= -1;
  if (y + rect.height >= h || y <= 0) dy *= -1;

  msgEl.style.left = x + "px";
  msgEl.style.top = y + "px";

  requestAnimationFrame(animate);
}

animate();

/* TIMER */
const timerEl = document.getElementById("timer");
const target = new Date(2026, 3, 20, 23, 0, 0);

function updateTimer(){
  const now = new Date();
  let diff = target - now;

  if(diff <= 0){
    timerEl.textContent = "❤️ Ich bin bei dir ❤️";
    return;
  }

  let s = Math.floor(diff/1000);
  let d = Math.floor(s/86400);
  let h = Math.floor((s%86400)/3600);
  let m = Math.floor((s%3600)/60);
  let sec = s%60;

  timerEl.textContent =
    d+"d "+h+"h "+m+"m "+sec+"s";
}

setInterval(updateTimer,1000);
updateTimer();

</script>

</body>
</html>
